name: Compila l'APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Chiave di firma fissa, se è stata salvata nei segreti del repository:
      # così ogni nuova versione si installa sopra la precedente.
      - name: Prepara la chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"
          fi

      # In mancanza del segreto si usa la chiave di prova, conservata fra una compilazione e l'altra.
      - name: Recupera la chiave di prova
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chiave-di-prova-agenda

      - name: Compila
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rinomina il file
        run: cp app/build/outputs/apk/release/app-release.apk AgendaSfogliabile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AgendaSfogliabile
          path: AgendaSfogliabile.apk

      - name: Pubblica la versione
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Agenda Sfogliabile 1.0.${{ github.run_number }}
          body: Scarica il file AgendaSfogliabile.apk qui sotto e aprilo dal telefono per installarlo o aggiornarlo.
          files: AgendaSfogliabile.apk
